name: March Madness Game Alerts

on:
  # schedule:
  #   - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  send-games:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send game alerts
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python march-madness/march_madness.py

      # Commit the sent_games.json tracking file so we don't double-text
      - name: Track sent games
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add march-madness/sent_games.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update sent games tracker"
          git push || true
