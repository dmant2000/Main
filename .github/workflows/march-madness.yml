name: March Madness Game Alerts

on:
  schedule:
    # Run at 9 AM ET (2 PM UTC) daily during tournament
    # March Madness typically runs mid-March through early April
    - cron: '0 14 * * *'
    # Also run at 5 PM ET (10 PM UTC) for evening game updates
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  send-games:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send game alerts
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python march_madness.py
